<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masjid Web AR Experience</title>

  <!-- A-Frame VR/AR framework (Updated to 1.4.2 for better stability) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js" crossorigin="anonymous"></script>
  
  <!-- MindAR library for image tracking in A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" crossorigin="anonymous"></script>
  
  <!-- Custom Touch Rotation & Scaling Script (Replaces buggy arjs-gestures) -->
  <script>
    AFRAME.registerComponent('drag-rotate-scale', {
      schema: { speed: { default: 1.5 } },
      init: function () {
        this.ifMouseDown = false;
        this.x_cord = 0;
        this.y_cord = 0;
        this.initialScale = this.el.object3D.scale.x;
        this.initialDistance = 0;

        // Listen for touches anywhere on the screen
        document.addEventListener('touchstart', this.OnTouchStart.bind(this), {passive: true});
        document.addEventListener('touchmove', this.OnTouchMove.bind(this), {passive: false});
        document.addEventListener('touchend', this.OnTouchEnd.bind(this));
      },
      OnTouchStart: function (e) {
        if (e.touches.length === 1) {
          this.ifMouseDown = true;
          this.x_cord = e.touches[0].clientX;
          this.y_cord = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          this.ifMouseDown = false;
          this.initialDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          this.initialScale = this.el.object3D.scale.x;
        }
      },
      OnTouchMove: function (e) {
        // Don't interact with the 3D model if touching UI buttons
        if(e.target.id === 'start-btn') return;
        
        if (this.ifMouseDown && e.touches.length === 1) {
          e.preventDefault(); // Stop page scrolling
          var temp_x = e.touches[0].clientX - this.x_cord;
          var temp_y = e.touches[0].clientY - this.y_cord;
          
          // Rotate around Y and X axis based on finger drag
          this.el.object3D.rotation.y += temp_x * this.data.speed * 0.01;
          this.el.object3D.rotation.x += temp_y * this.data.speed * 0.01;
          
          this.x_cord = e.touches[0].clientX;
          this.y_cord = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          e.preventDefault(); // Stop browser zooming
          var currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          var scaleFactor = currentDistance / this.initialDistance;
          var newScale = this.initialScale * scaleFactor;
          
          // Limit scale size (min 0.05, max 5)
          newScale = Math.max(0.05, Math.min(newScale, 5));
          this.el.object3D.scale.set(newScale, newScale, newScale);
        }
      },
      OnTouchEnd: function () {
        this.ifMouseDown = false;
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #000;
    }
    
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.9);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      backdrop-filter: blur(10px);
    }

    #start-screen h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    #start-screen p {
      margin-bottom: 30px;
      font-size: 16px;
      color: #cbd5e1;
      text-align: center;
      max-width: 80%;
    }

    #start-btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
      transition: transform 0.2s, background-color 0.2s;
    }

    #start-btn:active {
      transform: scale(0.95);
      background-color: #2563eb;
    }

    #ui-container {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none; /* Let touches pass through to the AR canvas */
    }
    
    .instruction-badge {
      display: inline-block;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>

  <script>
    // This catches unhandled rejections and extracts the real error message 
    // instead of showing a cryptic object. Helpful for catching missing files.
    window.addEventListener('unhandledrejection', function(event) {
      console.warn("Caught unhandled promise rejection. This usually means a file (.mind, .glb) is missing.", event.reason || event);
      event.preventDefault(); 
    });

    document.addEventListener("DOMContentLoaded", function() {
      const startBtn = document.getElementById("start-btn");
      const startScreen = document.getElementById("start-screen");
      const sceneEl = document.querySelector('a-scene');

      startBtn.addEventListener("click", function() {
        // Hide the start screen
        startScreen.style.display = "none";

        // Start the MindAR Engine manually now that we have user interaction
        const arSystem = sceneEl.systems["mindar-image-system"];
        if(arSystem) {
            arSystem.start().catch((err) => {
                console.error("MindAR failed to start. Ensure camera permissions are granted and files are available.", err);
                alert("Failed to start AR. Please ensure camera access is allowed and your .mind/.glb files are in the repository.");
            });
        }
      });
    });
  </script>
</head>
<body>

  <div id="start-screen">
    <h1>Masjid AR</h1>
    <p>Allow camera access and scan the image to view the 3D model.</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <!-- UI Overlay for Instructions -->
  <div id="ui-container">
    <div class="instruction-badge">
      Scan the image. Use fingers to rotate & scale.
    </div>
  </div>

  <!-- 
    A-Frame Scene configured for MindAR image tracking.
  -->
  <a-scene 
    mindar-image="imageTargetSrc: masjid.mind; autoStart: false; filterMinCF:0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <!-- Code-generated Textures (No external downloads required) -->
    <a-assets>
      <img id="tex-marble" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='%23f8fafc'/><path d='M0 63 L64 63 M63 0 L63 64' stroke='%23e2e8f0' stroke-width='2'/></svg>">
      <img id="tex-wall" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='%23f1f5f9'/><path d='M0 32 L64 32 M32 0 L32 32 M0 32 L0 64' stroke='%23cbd5e1' stroke-width='2'/></svg>">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Image Target Entity -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 
        Custom 3D Masjid Group. 
        Attached the custom 'drag-rotate-scale' component here!
      -->
      <a-entity drag-rotate-scale position="0 -0.2 0" scale="0.4 0.4 0.4">
        
        <!-- Courtyard / Marble Base -->
        <a-box position="0 0 0" width="2.2" height="0.1" depth="2.2" src="#tex-marble" repeat="4 4" shadow></a-box>
        
        <!-- Main Building Block -->
        <a-box position="0 0.5 0" width="1.4" height="0.9" depth="1.4" src="#tex-wall" repeat="2 1.5" material="roughness: 0.9;" shadow></a-box>
        
        <!-- Main Dome Drum (Base) -->
        <a-cylinder position="0 1.05 0" radius="0.55" height="0.2" color="#e2e8f0" material="roughness: 0.9;"></a-cylinder>
        
        <!-- Main Central Dome (Slightly shiny Emerald) -->
        <a-sphere position="0 1.15 0" radius="0.55" color="#10b981" theta-length="180" material="roughness: 0.3; metalness: 0.2"></a-sphere>
        
        <!-- Main Dome Gold Finial & Crescent Moon -->
        <a-cylinder position="0 1.8 0" radius="0.02" height="0.3" color="#fbbf24" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
        <a-torus position="0 2.0 0" radius="0.08" radius-tubular="0.015" arc="180" color="#fbbf24" rotation="0 90 90" material="metalness: 0.8; roughness: 0.2"></a-torus>

        <!-- Arched Iwan (Entrance) -->
        <a-entity position="0 0.05 0.7">
          <!-- Cutout Illusion -->
          <a-box position="0 0.3 0.02" width="0.4" height="0.6" depth="0.05" color="#1e293b"></a-box>
          <a-cylinder position="0 0.6 0.02" radius="0.2" height="0.05" rotation="90 0 0" color="#1e293b" theta-length="180"></a-cylinder>
          
          <!-- Entrance Pillars -->
          <a-cylinder position="-0.2 0.3 0.06" radius="0.03" height="0.6" color="#fbbf24" material="metalness: 0.6; roughness: 0.4"></a-cylinder>
          <a-cylinder position="0.2 0.3 0.06" radius="0.03" height="0.6" color="#fbbf24" material="metalness: 0.6; roughness: 0.4"></a-cylinder>
        </a-entity>

        <!-- === MINARETS === -->
        
        <!-- Front Left Minaret -->
        <a-entity position="-0.65 0 0.65">
          <a-box position="0 0.3 0" width="0.2" height="0.6" depth="0.2" src="#tex-wall"></a-box>
          <a-cylinder position="0 0.9 0" radius="0.06" height="0.7" color="#f8fafc"></a-cylinder>
          <a-cylinder position="0 1.25 0" radius="0.1" height="0.05" color="#94a3b8"></a-cylinder> <!-- Balcony -->
          <a-cylinder position="0 1.5 0" radius="0.04" height="0.5" color="#f8fafc"></a-cylinder>
          <a-sphere position="0 1.75 0" radius="0.06" color="#10b981" theta-length="180" material="roughness: 0.3; metalness: 0.2"></a-sphere>
          <a-cylinder position="0 1.85 0" radius="0.005" height="0.15" color="#fbbf24"></a-cylinder>
        </a-entity>

        <!-- Front Right Minaret -->
        <a-entity position="0.65 0 0.65">
          <a-box position="0 0.3 0" width="0.2" height="0.6" depth="0.2" src="#tex-wall"></a-box>
          <a-cylinder position="0 0.9 0" radius="0.06" height="0.7" color="#f8fafc"></a-cylinder>
          <a-cylinder position="0 1.25 0" radius="0.1" height="0.05" color="#94a3b8"></a-cylinder>
          <a-cylinder position="0 1.5 0" radius="0.04" height="0.5" color="#f8fafc"></a-cylinder>
          <a-sphere position="0 1.75 0" radius="0.06" color="#10b981" theta-length="180" material="roughness: 0.3; metalness: 0.2"></a-sphere>
          <a-cylinder position="0 1.85 0" radius="0.005" height="0.15" color="#fbbf24"></a-cylinder>
        </a-entity>

        <!-- Back Left Minaret -->
        <a-entity position="-0.65 0 -0.65">
          <a-box position="0 0.3 0" width="0.2" height="0.6" depth="0.2" src="#tex-wall"></a-box>
          <a-cylinder position="0 0.9 0" radius="0.06" height="0.7" color="#f8fafc"></a-cylinder>
          <a-cylinder position="0 1.25 0" radius="0.1" height="0.05" color="#94a3b8"></a-cylinder>
          <a-cylinder position="0 1.5 0" radius="0.04" height="0.5" color="#f8fafc"></a-cylinder>
          <a-sphere position="0 1.75 0" radius="0.06" color="#10b981" theta-length="180" material="roughness: 0.3; metalness: 0.2"></a-sphere>
          <a-cylinder position="0 1.85 0" radius="0.005" height="0.15" color="#fbbf24"></a-cylinder>
        </a-entity>

        <!-- Back Right Minaret -->
        <a-entity position="0.65 0 -0.65">
          <a-box position="0 0.3 0" width="0.2" height="0.6" depth="0.2" src="#tex-wall"></a-box>
          <a-cylinder position="0 0.9 0" radius="0.06" height="0.7" color="#f8fafc"></a-cylinder>
          <a-cylinder position="0 1.25 0" radius="0.1" height="0.05" color="#94a3b8"></a-cylinder>
          <a-cylinder position="0 1.5 0" radius="0.04" height="0.5" color="#f8fafc"></a-cylinder>
          <a-sphere position="0 1.75 0" radius="0.06" color="#10b981" theta-length="180" material="roughness: 0.3; metalness: 0.2"></a-sphere>
          <a-cylinder position="0 1.85 0" radius="0.005" height="0.15" color="#fbbf24"></a-cylinder>
        </a-entity>

      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
